# yaml-language-server: $schema=./eval.schema.json
version: 1
name: general-agent-python

targets:
  - name: general-agent
    kind: python
    entrypoint: examples.general_agent:general_llm_agent

dataset:
  kind: csv
  path: data.csv
  task_id_col: id
  input_col: question
  expected_col: expected_answer

graders:
  - uses: contains_expected
  - uses: rubric_judge
    when: { category: reasoning }
    args:
      model: openai:gpt-5-mini
      rubric: "The answer must be logically correct and at most five words."

run:
  trials: 1
  max_concurrency: 4

env_passthrough: [OPENAI_API_KEY]
pythonpath: [src]
